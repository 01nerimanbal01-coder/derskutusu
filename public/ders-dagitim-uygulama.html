:root{

  --ok:#237A66; --ok-soft:#DBF0E9; --warn:#A8690F; --warn-soft:#FAEBCF; --danger:#AE3545; --danger-soft:#F8DEE2;
  --cs:62%; --cl:88%; --cs2:70%; --cl2:30%;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.06);
}

    --bg:#10151D; --surface:#171E29; --surface-2:#1F2835; --surface-3:#283344; --border:#30405A; --fg:#E7ECF3; --muted:#9AA7B8;
    --accent:#86B4F2; --accent-fg:#0E1A2B; --accent-soft:#1E2F47; --accent-line:#3A5B86;
    --ok:#6FCBB0; --ok-soft:#173A33; --warn:#E6B45E; --warn-soft:#3B2E13; --danger:#F08A98; --danger-soft:#44202A;
    --cs:38%; --cl:27%; --cs2:60%; --cl2:78%;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151D; --surface:#171E29; --surface-2:#1F2835; --surface-3:#283344; --border:#30405A; --fg:#E7ECF3; --muted:#9AA7B8;
  --accent:#86B4F2; --accent-fg:#0E1A2B; --accent-soft:#1E2F47; --accent-line:#3A5B86;
  --ok:#6FCBB0; --ok-soft:#173A33; --warn:#E6B45E; --warn-soft:#3B2E13; --danger:#F08A98; --danger-soft:#44202A;

.tabs::-webkit-scrollbar{display:none}

.tab:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.cellbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{padding-block:18px 56px}

.list{display:grid;gap:10px}

.item-head .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item-body{padding:12px;border-top:1px solid var(--border);background:var(--bg)}
.chev{width:18px;height:18px;color:var(--muted);transition:transform .15s;flex:none}
.open .chev{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
.scroll-x{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}

.tt td.lesson{background:hsl(var(--h) var(--cs) var(--cl));color:var(--fg)}
.tt td.lunch{border-top:2px dashed var(--accent-line)}
.tt td.empty{background:var(--surface-2);color:var(--muted);text-align:center;font-size:11px}

.tray{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--danger);background:var(--danger-soft);color:var(--danger);border-radius:999px;padding:4px 10px;cursor:pointer}
.chip.sel{outline:2px solid var(--accent)}
.panel{border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--radius);padding:10px 12px;display:grid;gap:8px}

.tt td .s{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tt.editable td{cursor:pointer}
.tt td.sel{outline:2px solid var(--accent);outline-offset:-2px}

.tt.compact td{width:66px;min-width:58px;height:34px;font-size:11.5px;padding:3px 5px;text-align:center;vertical-align:middle}

.avail{border-collapse:separate;border-spacing:3px}

.notice svg{width:18px;height:18px;flex:none;margin-top:1px}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar select{width:auto;min-width:140px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex-wrap:wrap}

/* Ders Dağıtım Programı — yerleştirme motoru.
   Kendi kendine yeterli bir fonksiyon: hem ana sayfada hem Web Worker içinde aynı kaynaktan çalışır. */
function createScheduler() {
  'use strict';

  var DAY_NAMES = ['Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi', 'Pazar'];
  var DAY_SHORT = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];

  var DEFAULT_WEIGHTS = {
    unplaced: 1000,  // yerleştirilemeyen her ders saati
    tUndesired: 6,   // öğretmenin istemediği saate ders
    tGap: 4,         // öğretmenin gün içindeki boş saati
    tDays: 20,       // istediğinden fazla gün okula gelme
    tBalance: 1,     // günlük yükün dengesizliği
    cGap: 15,        // sınıfın gün içinde boş kalması
    adjDays: 2,      // aynı dersin ardışık günlere gelmesi
    timePref: 1      // sabah / öğleden sonra tercihi
  };

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function uniq(arr) { var s = []; arr.forEach(function (x) { if (s.indexOf(x) < 0) s.push(x); }); return s; }

  /* "2+2+1" -> [2,2,1]; geçersizse null */
  function parseDist(str) {

      /* u birimi (origDay, p) konumuna taşınabilir mi? */

          if (!c2 || c2.length) res = { ok: false, reason: model.activities[eng.uAct[b]].label + ' için çakışma: ' + (c2 ? c2.map(function (c) { return model.activities[eng.uAct[c]].label; }).join(', ') : 'kilitli ders') };

        var u = byKey[key]; if (u == null) return { ok: false, reason: 'Ders bulunamadı.' };
        var d = model.dayIdx.indexOf(+origDay); if (d < 0) return { ok: false, reason: 'Gün programda yok.' };
        if (!this._solver) { this._solver = new Solver(model, { engine: eng, seed: 11 }); this._solver.origDay = eng.uDay.slice(); this._solver.origPer = eng.uPer.slice(); }

  /* ---------- tanı: neden yerleşmedi, kimden kaynaklandı, ne yapılırsa yerleşir ---------- */

    var NEDEN_SIRASI = ['blokSigmaz', 'ogretmenYok', 'ayniGun', 'ogretmenSiniri', 'ogretmenDolu', 'sinifDolu', 'derslik'];
    var KESIN = { blokSigmaz: 1, ogretmenYok: 1 };
    var NEDEN_AD = {
      uygun: 'Boş ve uygun', blokSigmaz: 'Blok ders sığmıyor', ogretmenYok: 'Öğretmen müsait değil (Yok)',
      ayniGun: 'Bu dersin o gün zaten bir saati var', ogretmenSiniri: 'Öğretmenin günlük / art arda ders sınırı',
      ogretmenDolu: 'Öğretmenin o saatte başka dersi var', sinifDolu: 'Sınıfın o saatte başka dersi var', derslik: 'Derslik dolu'
    };

    function simdi() { return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now(); }
    function saatAdi(m, d, p) { return m.dayShort[d] + ' ' + (p + 1) + '.'; }
    function aralikAdi(m, d, p, k) { return m.dayShort[d] + ' ' + (p + 1) + '.' + (k > 1 ? '-' + (p + k) + '.' : ''); }

    function kopya(x) { return JSON.parse(JSON.stringify(x)); }

    function dersBilgisi(m, eng, v) {

    /* ------------------------------------------------------------------

    function hucreNedenleri(m, eng, u, d, p) {

        ekle('blok', { kod: 'blokSigmaz', tur: 'gunSonu',
          sorumlu: { tur: 'dagilim', ad: act.label + ' (dağılım: ' + act.chunks.join('+') + ')' },
          metin: k + ' saatlik blok ' + m.dayNames[d] + ' ' + (p + 1) + '. saatte başlarsa gün sonuna taşıyor (o gün ' + gunSonu + ' ders saati var).' });
      }
      if (m.lunchAfter > 0 && p < m.lunchAfter && p + k > m.lunchAfter) {
        ekle('ogle', { kod: 'blokSigmaz', tur: 'ogleArasi', sorumlu: { tur: 'ayar', ad: 'Öğle arası ayarı' },
          metin: k + ' saatlik blok öğle arasını bölüyor (' + m.lunchAfter + '. saatten sonra öğle arası).' });
      }
      for (i = 0; i < ts.length; i++) {
        t = ts[i]; var te = m.teachers[t];
        for (q = p; q < sonQ; q++) if (te.avail[d * P + q] === 2) {
          var o = ekle('yok:' + t, { kod: 'ogretmenYok', ogretmen: te.name, ogretmenIdx: t, ogretmenId: te.id, blokSaatleri: [],
            sorumlu: { tur: 'yokIsareti', ad: te.name } }, q);
          o.blokSaatleri.push(q - p + 1);
        }
      }
      for (i = 0; i < cls.length; i++) for (q = p; q < sonQ; q++) {
        v = eng.cg[(cls[i] * D + d) * P + q];
        if (v >= 0 && v !== u) {
          var db = dersBilgisi(m, eng, v);
          ekle('s:' + v, { kod: 'sinifDolu', sinif: m.classes[cls[i]].name, ders: db,

          cakisanEkle(v);
        }
      }
      for (i = 0; i < ts.length; i++) for (q = p; q < sonQ; q++) {
        t = ts[i]; v = eng.tg[(t * D + d) * P + q];
        if (v >= 0 && v !== u) {
          var db2 = dersBilgisi(m, eng, v);
          ekle('o:' + t + ':' + v, { kod: 'ogretmenDolu', ogretmen: m.teachers[t].name, ogretmenIdx: t, ders: db2,
            sorumlu: { tur: 'ogretmenDersi', ad: m.teachers[t].name } }, q);
          cakisanEkle(v);
        }
      }
      v = eng.ad[a * D + d];
      if (v >= 0 && v !== u) {
        var db3 = dersBilgisi(m, eng, v);
        ekle('g:' + v, { kod: 'ayniGun', ders: db3, sorumlu: { tur: 'dagilim', ad: act.label + ' (dağılım: ' + act.chunks.join('+') + ')' } }, null);

      if (r >= 0) {

          var arr = eng.rg[(r * D + d) * P + q], kalan = [];
          for (i = 0; i < arr.length; i++) if (arr[i] !== u && cakisan.indexOf(arr[i]) < 0) kalan.push(arr[i]);
          if (kalan.length >= m.rooms[r].cap) {
            var dl = kalan.map(function (x) { return dersBilgisi(m, eng, x); });
            ekle('r:' + r, { kod: 'derslik', derslik: m.rooms[r].name, dersler: dl, sorumlu: { tur: 'derslik', ad: m.rooms[r].name } }, q);
            cakisanEkle(kalan[0]);
          }
        }
      }
      /* öğretmen günlük / art arda sınırı — çakışan dersler çıkarılmış varsayılarak */
      for (i = 0; i < ts.length; i++) {
        t = ts[i]; var te2 = m.teachers[t];

        if (te2.maxConsec > 0) {
          var run = 0, enUzun = 0; for (q = 0; q < P; q++) { run = dolu[q] ? run + 1 : 0; if (run > enUzun) enUzun = run; }
          if (enUzun > te2.maxConsec) ekle('ard:' + t, { kod: 'ogretmenSiniri', tur: 'ardisik', ogretmen: te2.name, sinir: te2.maxConsec, olacak: enUzun, sorumlu: { tur: 'sinir', ad: te2.name } }, null);

    }
    function saatlerMetni(m, d, saatler) { return saatler.map(function (q) { return saatAdi(m, d, q); }).join(', '); }

        case 'ogretmenYok': return n.ogretmen + ' bu saatte müsait değil ("Yok" işaretli: ' + saatlerMetni(m, d, n.saatler) + (k > 1 ? '; ' + k + ' saatlik bloğun ' + n.blokSaatleri.join(' ve ') + '. saati' : '') + ').';
        case 'sinifDolu': return n.sinif + ' sınıfının bu saatte ' + n.ders.konu + ' dersi var (' + ogretmenMetni(n.ders) + ', ' + n.ders.yer.ad + ')' + (n.ders.kilitli ? ' — kilitli' : '') + '.';
        case 'ogretmenDolu': return n.ogretmen + ' bu saatte ' + n.ders.siniflar.join(', ') + ' sınıfında ' + n.ders.konu + ' dersinde (' + n.ders.yer.ad + ')' + (n.ders.kilitli ? ' — kilitli' : '') + '.';
        case 'ayniGun': return 'Bu dersin bu gün zaten bir saati var (' + n.ders.yer.ad + '); aynı ders bir güne iki parça konmaz.';
        case 'ogretmenSiniri': return n.ogretmen + ' için ' + (n.tur === 'gunluk' ? 'günlük en fazla ' + n.sinir + ' ders sınırı aşılıyor (' + n.olacak + ' olur).' : 'art arda en fazla ' + n.sinir + ' ders sınırı aşılıyor (' + n.olacak + ' olur).');

      }

    }

    /* ------------------------------------------------------------------
     * 2) Zincirleme kaydırma (forceMove'un bütçesi ayarlanabilir, sonucu
     *    "kim nereden nereye" olarak dönen sürümü). dry=true → geri alınır.
     * ------------------------------------------------------------------ */

      var od = eng.uDay[u], op = eng.uPer[u];
      if (od === d && op === p) return { ok: false, sebep: 'ayniYer' };
      var once = eng.total, onceYerlesmeyen = eng.unplacedHours, journal = [];
      if (od >= 0) { eng.unplace(u); journal.push([1, u, od, op]); }
      var conf = eng.conflictsAt(u, d, p);
      if (!conf) { sv.undoTo(journal, 0); return { ok: false, sebep: 'kilitliCakisma' }; }
      for (var i = 0; i < conf.length; i++) { var c = conf[i]; journal.push([1, c, eng.uDay[c], eng.uPer[c]]); eng.unplace(c); }
      eng.place(u, d, p); journal.push([0, u]);

      }

    function cozucuKur(chk, tohum, derinlik, dal) {
      var sv = new Solver(chk.model, { engine: chk.engine, seed: tohum, maxDepth: derinlik, maxBranch: dal });
      sv.origDay = chk.engine.uDay.slice(); sv.origPer = chk.engine.uPer.slice();

    }

      { tohum: 11, derinlik: 4, dal: 6, butce: 400 },   /* arayüzdeki "kaydırarak taşı" ile aynı */
      { tohum: 7, derinlik: 5, dal: 8, butce: 1500 },
      { tohum: 3, derinlik: 6, dal: 8, butce: 4000 }

    /* u birimini tüm aday saatlerde dener; en az ders kaydıran çözümü döner.

    function yerlestirmeyiDene(chk, key, secenek) {

      if (u == null) return { ok: false, sebep: 'dersYok' };

      var adaylar = [];

        var d = Math.floor(s / P), p = s % P, conf = eng.conflictsAt(u, d, p);
        if (conf) adaylar.push({ d: d, p: p, n: conf.length });
      });
      adaylar.sort(function (x, y) { return x.n - y.n; });
      var en = null, denemeler = 0, kullanilanAyar = null;
      for (var a = 0; a < ayarlar.length && !en; a++) {
        var ay = ayarlar[a], sv = cozucuKur(chk, ay.tohum, ay.derinlik, ay.dal);
        for (var i = 0; i < adaylar.length; i++) {
          denemeler++;
          var r = kaydirarakDene(sv, u, adaylar[i].d, adaylar[i].p, ay.butce, true);
          if (r.ok && (!en || r.kayanlar.length < en.kayanlar.length || (r.kayanlar.length === en.kayanlar.length && r.yumusakFark < en.yumusakFark))) { en = r; en.d = adaylar[i].d; en.p = adaylar[i].p; kullanilanAyar = ay; }
          if (en && en.kayanlar.length === 0) break;
        }
      }
      var sonuc = { ok: !!en, key: key, denemeler: denemeler, adaySaat: adaylar.length, sureMs: 0 };
      if (en) {
        sonuc.yer = en.yer; sonuc.kayanlar = en.kayanlar; sonuc.yumusakFark = en.yumusakFark; sonuc.ayar = kullanilanAyar;
        if (secenek.uygula) {
          var sv2 = cozucuKur(chk, kullanilanAyar.tohum, kullanilanAyar.derinlik, kullanilanAyar.dal);
          var r2 = kaydirarakDene(sv2, u, en.d, en.p, kullanilanAyar.butce, false);
          if (!r2.ok) { /* tohumlu arama aynı yolu izler; yine de güvence */ sonuc.ok = false; sonuc.sebep = 'uygulanamadi'; }
          else { sonuc.kayanlar = r2.kayanlar; sonuc.assignment = eng.assignment(); }

    }

    /* ------------------------------------------------------------------
     * 2b) BÖLGESEL TAM ÇÖZÜM (veri değiştirmeden): seçilen birkaç sınıfın

    function bolgeselCoz(chk, hedefler, sinifKume, secenek) {

      for (u = 0; u < eng.U; u++) {

      function adaylar(x) {
        var sl = eng.uSlots[x], out = [];
        for (var j = 0; j < sl.length; j++) {
          var d = Math.floor(sl[j] / P), p = sl[j] % P, c = eng.conflictsAt(x, d, p);
          if (!c || c.length) continue;
          if (sinirli) { eng.place(x, d, p); var ok = eng.teachersOk(x, d); eng.unplace(x); if (!ok) continue; }
          out.push(sl[j]);
        }
        return out;
      }
      function ara(kalan) {
        if (!kalan.length) return true;
        if (++dugum > dugumSiniri || (dugum % 256 === 0 && simdi() - t0 > sureSiniri)) { asildi = true; return false; }
        var enI = -1, enL = null, kapsam = {};
        for (var a = 0; a < kalan.length; a++) {
          var x = kalan[a], l = adaylar(x);
          if (!l.length) return false;
          /* kapsama: tam dolu sınıflarda her boş hücreyi kalan bir ders örtebilmeli */
          var kc = eng.uClasses[x], k = eng.uSize[x];
          for (var b = 0; b < l.length; b++) { var d0 = Math.floor(l[b] / P), p0 = l[b] % P; for (var c0 = 0; c0 < kc.length; c0++) for (var q = p0; q < p0 + k; q++) kapsam[(kc[c0] * D + d0) * P + q] = 1; }
          if (!enL || l.length < enL.length) { enI = a; enL = l; }
        }
        for (var s = 0; s < sinifKume.length; s++) {
          var c = sinifKume[s], cl = m.classes[c];
          if (cl.hours < cl.slots) continue; /* yalnız tam dolu sınıflarda geçerli */
          for (var dd = 0; dd < D; dd++) for (var pp = 0; pp < cl.pd[dd]; pp++) { var h = (c * D + dd) * P + pp; if (eng.cg[h] < 0 && !kapsam[h]) return false; }
        }
        var y = kalan[enI], geri = kalan.slice(0, enI).concat(kalan.slice(enI + 1));
        var eski = orjD[y] >= 0 ? orjD[y] * P + orjP[y] : -1;
        var sk = function (sx) { return sx === eski ? 0 : (Math.floor(sx / P) === orjD[y] ? 1 : 2); };
        enL.sort(function (s1, s2) { return sk(s1) - sk(s2) || s1 - s2; });
        for (var e = 0; e < enL.length; e++) {
          eng.place(y, Math.floor(enL[e] / P), enL[e] % P);
          if (ara(geri)) return true;
          eng.unplace(y);
          if (asildi) return false;
        }
        return false;
      }
      var bulundu = ara(serbest.slice());
      var sonuc = { ok: bulundu, dugum: dugum, asildi: asildi && !bulundu, serbestDers: serbest.length, siniflar: sinifKume.map(function (c) { return m.classes[c].name; }), sureMs: Math.round(simdi() - t0) };
      if (bulundu) {
        sonuc.kayanlar = [];
        serbest.forEach(function (x) {
          if (hedefler.indexOf(x) >= 0) return;
          if (eng.uDay[x] !== orjD[x] || eng.uPer[x] !== orjP[x]) sonuc.kayanlar.push({ ders: dersBilgisi(m, eng, x), nereden: konum(m, orjD[x], orjP[x], eng.uSize[x]), nereye: konum(m, eng.uDay[x], eng.uPer[x], eng.uSize[x]) });
        });
        sonuc.yerler = hedefler.map(function (x) { return { key: m.units[x].key, yer: konum(m, eng.uDay[x], eng.uPer[x], eng.uSize[x]) }; });
        if (secenek.uygula) { eng.fullCost(); sonuc.assignment = eng.assignment(); return sonuc; }
      }
      /* geri al: hepsini eski yerine */
      serbest.forEach(function (x) { if (eng.uDay[x] >= 0) eng.unplace(x); });
      serbest.forEach(function (x) { if (orjD[x] >= 0) eng.place(x, orjD[x], orjP[x]); });
      eng.fullCost();
      return sonuc;
    }

    /* ------------------------------------------------------------------
     * 2c) EN AZ KAYDIRMA (veri değiştirmeden): yinelemeli derinleştirmeli
     *     tam "itme zinciri" araması. Yerleşmeyen ders bir saate konur,
     *     oradaki dersler çıkarılır, onlar da başka saatlere konur...
     *     Toplam kayan ders sayısı k ile sınırlıdır; k = 0, 1, 2, ... sırayla
     *     denenir. İlk bulunan çözüm EN AZ ders kaydıran çözümdür (alt k'ler
     *     düğüm sınırına takılmadan bitmişse "kanıtlı en az" olur).
     *     Bir ders bir zincirde en çok bir kez kayar.
     * ------------------------------------------------------------------ */
    function zincirAra(chk, keys, secenek) {
      secenek = secenek || {};
      var eng = chk.engine, m = chk.model, P = m.P, t0 = simdi();
      var K = secenek.enFazlaKayan != null ? secenek.enFazlaKayan : 8, dugumSiniri = secenek.dugumSiniri || 400000, sureSiniri = secenek.sureMs || 3000;
      var hedef = keys.map(function (k) { return chk.unitIdx(k); }).filter(function (u) { return eng.uDay[u] < 0; });
      var sinirli = m.teachers.some(function (te) { return te.maxPerDay > 0 || te.maxConsec > 0; });
      var hedefMi = new Uint8Array(eng.U); hedef.forEach(function (u) { hedefMi[u] = 1; });
      /* secenek.siniflar verilirse yalnızca o sınıfların dersleri kayabilir (bölge) */
      var izinli = null;
      if (secenek.siniflar) { izinli = new Uint8Array(eng.U); for (var z = 0; z < eng.U; z++) if (eng.uClasses[z].some(function (c) { return secenek.siniflar.indexOf(c) >= 0; })) izinli[z] = 1; }
      /* secenek.ilkYer {d,p}: tek hedefin başlangıç saati sabitlenir (saat tablosu hücresi için) */
      var ilkYer = secenek.ilkYer || null;
      var kaydi = new Uint8Array(eng.U), eskiD = new Int16Array(eng.U), eskiP = new Int16Array(eng.U);
      var bekleyen = [], dugum = 0, asildi = false, kayitlar = [], engelSinif = {};
      function secenekler(x, butce) {
        var sl = eng.uSlots[x], out = [];
        if (ilkYer && hedefMi[x]) sl = eng.structOk(x, ilkYer.d, ilkYer.p) ? [ilkYer.d * P + ilkYer.p] : [];
        for (var j = 0; j < sl.length; j++) {
          var d = Math.floor(sl[j] / P), p = sl[j] % P, c = eng.conflictsAt(x, d, p);
          if (!c || c.length > butce) continue;
          var ok = true;
          for (var i = 0; i < c.length; i++) {
            if (hedefMi[c[i]] || kaydi[c[i]]) { ok = false; break; }
            if (izinli && !izinli[c[i]]) { ok = false; var w = bekleyen.length <= 1 ? 1 : 1 / (bekleyen.length * bekleyen.length * 4); eng.uClasses[c[i]].forEach(function (cc) { engelSinif[cc] = (engelSinif[cc] || 0) + w; }); break; }
          }
          if (ok) out.push({ d: d, p: p, c: c });
        }
        out.sort(function (a, b) { return a.c.length - b.c.length || (a.d * P + a.p) - (b.d * P + b.p); });
        return out;
      }
      function ara(butce) {
        if (!bekleyen.length) return true;
        if (++dugum > dugumSiniri || ((dugum & 255) === 0 && simdi() - t0 > sureSiniri)) { asildi = true; return false; }
        var enI = -1, enL = null;
        for (var i = 0; i < bekleyen.length; i++) {
          var l = secenekler(bekleyen[i], butce);
          if (!l.length) return false;
          if (!enL || l.length < enL.length) { enI = i; enL = l; }
        }
        var x = bekleyen[enI]; bekleyen.splice(enI, 1);
        for (var o = 0; o < enL.length; o++) {
          var sec = enL[o], c = sec.c, j;
          for (j = 0; j < c.length; j++) { var y = c[j]; eskiD[y] = eng.uDay[y]; eskiP[y] = eng.uPer[y]; eng.unplace(y); kaydi[y] = 1; bekleyen.push(y); }
          eng.place(x, sec.d, sec.p);
          if ((!sinirli || eng.teachersOk(x, sec.d)) && ara(butce - c.length)) return true;
          eng.unplace(x);
          for (j = c.length - 1; j >= 0; j--) { var y2 = c[j]; bekleyen.pop(); kaydi[y2] = 0; eng.place(y2, eskiD[y2], eskiP[y2]); }
          if (asildi) break;
        }
        bekleyen.splice(enI, 0, x);
        return false;
      }
      var bulundu = false, k;
      var once = { day: eng.uDay.slice(), per: eng.uPer.slice() };
      for (k = 0; k <= K; k++) {
        bekleyen = hedef.slice(); var dk = dugum;
        if (ara(k)) { bulundu = true; kayitlar.push({ k: k, dugum: dugum - dk, sonuc: 'bulundu' }); break; }
        kayitlar.push({ k: k, dugum: dugum - dk, sonuc: asildi ? 'sinir' : 'yok' });
        if (asildi) break;
      }
      var sonuc = { ok: bulundu, enAzKanitli: bulundu && kayitlar.every(function (r) { return r.sonuc !== 'sinir'; }), aranan: kayitlar, dugum: dugum, sureMs: 0, engelSinif: engelSinif };
      if (bulundu) {
        sonuc.kayanlar = [];
        for (var u = 0; u < eng.U; u++) if (!hedefMi[u] && once.day[u] >= 0 && (eng.uDay[u] !== once.day[u] || eng.uPer[u] !== once.per[u]))
          sonuc.kayanlar.push({ ders: dersBilgisi(m, eng, u), nereden: konum(m, once.day[u], once.per[u], eng.uSize[u]), nereye: konum(m, eng.uDay[u], eng.uPer[u], eng.uSize[u]) });
        sonuc.yerler = hedef.map(function (x) { return { key: m.units[x].key, yer: konum(m, eng.uDay[x], eng.uPer[x], eng.uSize[x]) }; });
        if (secenek.uygula) { eng.fullCost(); sonuc.assignment = eng.assignment(); }
        else eng.restore(once);
      } else eng.fullCost();
      sonuc.sureMs = Math.round(simdi() - t0);
      return sonuc;
    }

    /* Bölgeyi tıkanmaya göre büyüterek en az kaydırmayı ara: önce yalnız
       dersin sınıfı; çözüm yoksa aramayı en çok tıkayan (kayamayan dersi olan)
       sınıf bölgeye eklenir. secenek: enFazlaSinif, enFazlaKayan, adimMs, toplamMs */
    function buyuyenBolge(chk, keys, secenek) {
      secenek = secenek || {};
      var t0 = simdi(), eng = chk.engine, m = chk.model, bolge = [], adimlar = [];
      keys.forEach(function (k) { eng.uClasses[chk.unitIdx(k)].forEach(function (c) { if (bolge.indexOf(c) < 0) bolge.push(c); }); });
      var enFazla = secenek.enFazlaSinif || 6, toplam = secenek.toplamMs || 10000;
      while (true) {
        var kalanMs = toplam - (simdi() - t0); if (kalanMs <= 0) break;
        var r = zincirAra(chk, keys, { enFazlaKayan: secenek.enFazlaKayan || 24, sureMs: Math.min(secenek.adimMs || 2500, kalanMs), dugumSiniri: secenek.dugumSiniri || 5000000, siniflar: bolge.slice(), uygula: secenek.uygula });
        var son = r.aranan[r.aranan.length - 1];
        adimlar.push({ siniflar: bolge.map(function (c) { return m.classes[c].name; }), sonuc: r.ok ? 'bulundu' : son.sonuc, k: r.ok ? r.kayanlar.length : son.k, dugum: r.dugum, sureMs: r.sureMs });
        if (r.ok) { r.bolge = adimlar[adimlar.length - 1].siniflar; r.adimlar = adimlar; r.toplamMs = Math.round(simdi() - t0); return r; }
        if (bolge.length >= enFazla) break;
        var aday = Object.keys(r.engelSinif).map(Number).filter(function (c) { return bolge.indexOf(c) < 0; }).sort(function (a, b) { return r.engelSinif[b] - r.engelSinif[a]; });
        if (!aday.length) break;
        bolge.push(aday[0]);
      }
      return { ok: false, adimlar: adimlar, toplamMs: Math.round(simdi() - t0) };
    }

    /* Hangi sınıflar birlikte açılsın? Yerleşmeyen dersin öğretmen(ler)i ve
       sınıfıyla en çok ortak öğretmeni olan sınıflar önce. Sırayla tekli,
       ikili, üçlü kümeler denenir; ilk çözüm (en küçük bölge) döner. */
    function bolgeAdaylari(chk, hedefler, enFazla) {
      var eng = chk.engine, m = chk.model, D = m.D, P = m.P;
      var anaSinif = [], tu = [], tc = [];
      hedefler.forEach(function (u) { eng.uClasses[u].forEach(function (c) { if (anaSinif.indexOf(c) < 0) anaSinif.push(c); }); eng.uTeachers[u].forEach(function (t) { if (tu.indexOf(t) < 0) tu.push(t); }); });
      for (var u = 0; u < eng.U; u++) if (eng.uClasses[u].some(function (c) { return anaSinif.indexOf(c) >= 0; })) eng.uTeachers[u].forEach(function (t) { if (tc.indexOf(t) < 0) tc.push(t); });
      var puan = {};
      for (var x = 0; x < eng.U; x++) {
        eng.uClasses[x].forEach(function (c) {
          if (anaSinif.indexOf(c) >= 0) return;
          var w = 0; eng.uTeachers[x].forEach(function (t) { if (tu.indexOf(t) >= 0) w += 3; else if (tc.indexOf(t) >= 0) w += 1; });
          if (w) puan[c] = (puan[c] || 0) + w * eng.uSize[x];
        });
      }
      /* ana sınıfın boş hücrelerinde hedef öğretmeni meşgul eden sınıflar en öne */
      anaSinif.forEach(function (c) { for (var d = 0; d < D; d++) for (var p = 0; p < m.classes[c].pd[d]; p++) if (eng.cg[(c * D + d) * P + p] < 0) tu.forEach(function (t) { var v = eng.tg[(t * D + d) * P + p]; if (v >= 0) eng.uClasses[v].forEach(function (c2) { puan[c2] = (puan[c2] || 0) + 100; }); }); });
      var sirali = Object.keys(puan).map(Number).sort(function (a, b) { return puan[b] - puan[a]; }).slice(0, enFazla || 8);
      var kumeler = [anaSinif.slice()];
      sirali.forEach(function (c) { kumeler.push(anaSinif.concat([c])); });
      for (var i = 0; i < Math.min(6, sirali.length); i++) for (var j = i + 1; j < Math.min(6, sirali.length); j++) kumeler.push(anaSinif.concat([sirali[i], sirali[j]]));
      for (var a = 0; a < Math.min(4, sirali.length); a++) for (var b = a + 1; b < Math.min(4, sirali.length); b++) for (var e = b + 1; e < Math.min(4, sirali.length); e++) kumeler.push(anaSinif.concat([sirali[a], sirali[b], sirali[e]]));
      return kumeler;
    }
    function bolgeselYerlestir(chk, keys, secenek) {
      secenek = secenek || {};
      var t0 = simdi(), hedefler = keys.map(function (k) { return chk.unitIdx(k); });
      var kumeler = secenek.kumeler || bolgeAdaylari(chk, hedefler, secenek.enFazlaSinif);
      var denenen = [], toplamSure = secenek.toplamMs || 8000;
      for (var i = 0; i < kumeler.length; i++) {
        if (simdi() - t0 > toplamSure) break;
        var r = bolgeselCoz(chk, hedefler, kumeler[i], { dugumSiniri: secenek.dugumSiniri || 60000, sureMs: secenek.kumeMs || 1500, uygula: secenek.uygula });
        denenen.push({ siniflar: r.siniflar, ok: r.ok, asildi: r.asildi, dugum: r.dugum, sureMs: r.sureMs });
        if (r.ok) { r.denenenKume = denenen; r.toplamMs = Math.round(simdi() - t0); return r; }
      }
      return { ok: false, denenenKume: denenen, toplamMs: Math.round(simdi() - t0) };
    }

    /* ------------------------------------------------------------------
     * 3) SAAT MATRİSİ: her (gün, saat) başlangıcı için durum + nedenler
     *    secenek.kaydirma: true → kesin engeli olmayan hücrelerde zincirleme
     *    kaydırma kuru denenir (arayüzdeki "kaydırarak taşı" ile aynı ayar).
     * ------------------------------------------------------------------ */
    function saatMatrisi(chk, key, secenek) {
      secenek = secenek || {};
      var t0 = simdi(), m = chk.model, eng = chk.engine, D = m.D, P = m.P, u = chk.unitIdx(key);
      if (u == null) return null;
      var k = eng.uSize[u], sv = null, ay = secenek.ayar || VARSAYILAN_AYARLAR[0];
      if (secenek.kaydirma) sv = cozucuKur(chk, ay.tohum, ay.derinlik, ay.dal);
      var hucreler = [];
      for (var d = 0; d < D; d++) {
        var satir = [];
        for (var p = 0; p < P; p++) {
          var h = { gun: m.dayIdx[d], gunAd: m.dayShort[d], saat: p, ad: aralikAdi(m, d, p, k) };
          var cls = eng.uClasses[u], varMi = p < m.periodsByDay[d];
          for (var ci = 0; ci < cls.length; ci++) if (p >= m.classes[cls[ci]].pd[d]) varMi = false;
          if (!varMi) { h.durum = 'yok'; satir.push(h); continue; }
          var hn = hucreNedenleri(m, eng, u, d, p);
          h.nedenler = hn.nedenler;
          h.kodlar = uniqKod(hn.nedenler);
          h.birincil = birincilNeden(hn.nedenler);
          var kesin = hn.nedenler.some(function (n) { return KESIN[n.kod]; }) || hn.nedenler.some(function (n) { return n.ders && n.ders.kilitli; });
          if (!hn.nedenler.length) h.durum = 'uygun';
          else if (kesin) h.durum = 'kesinEngel';
          else if (sv) {
            var r = kaydirarakDene(sv, u, d, p, ay.butce, true);
            if (r.ok) { h.durum = 'kaydirilabilir'; h.kaydirma = { kayanlar: r.kayanlar, yumusakFark: r.yumusakFark }; }
            else { h.durum = 'dolu'; h.kaydirmaSebep = r.sebep === 'zincir' ? (r.takilan.ad + ' için başka uygun yer bulunamadı.') : r.sebep; }
          } else h.durum = 'dolu';
          satir.push(h);
        }
        hucreler.push(satir);
      }
      return { birim: dersBilgisi(m, eng, u), gunler: m.dayShort.slice(), gunNo: m.dayIdx.slice(), saatSayisi: m.periodsByDay.slice(),
        hucreler: hucreler, sureMs: Math.round(simdi() - t0) };
    }
    function uniqKod(ns) { var o = []; ns.forEach(function (n) { if (o.indexOf(n.kod) < 0) o.push(n.kod); }); return o; }
    function birincilNeden(ns) {
      for (var i = 0; i < NEDEN_SIRASI.length; i++) for (var j = 0; j < ns.length; j++) if (ns[j].kod === NEDEN_SIRASI[i]) return NEDEN_SIRASI[i];
      return ns.length ? ns[0].kod : 'uygun';
    }

    /* ------------------------------------------------------------------
     * 4) SORUMLULUK ÖZETİ: aday saatleri kim kapatıyor; öğretmen/sınıf
     *    boşluğu; gün bazında yük; "ortak boş saat" var mı.
     * ------------------------------------------------------------------ */
    function sorumlulukOzeti(chk, key, matris) {
      var m = chk.model, eng = chk.engine, D = m.D, P = m.P, u = chk.unitIdx(key);
      matris = matris || saatMatrisi(chk, key);
      var k = eng.uSize[u], act = m.activities[eng.uAct[u]];
      var aday = 0, durumSay = { uygun: 0, kaydirilabilir: 0, dolu: 0, kesinEngel: 0 }, birincil = {};
      var varliklar = {}, d, p, h;
      function varlik(anahtar, tur, ad, ayrinti) { if (!varliklar[anahtar]) varliklar[anahtar] = { anahtar: anahtar, tur: tur, ad: ad, ayrinti: ayrinti || '', kapattigi: 0, tekBasina: 0, saatler: [] }; return varliklar[anahtar]; }
      for (d = 0; d < D; d++) for (p = 0; p < P; p++) {
        h = matris.hucreler[d][p]; if (h.durum === 'yok') continue;
        aday++; durumSay[h.durum]++;
        birincil[h.birincil] = (birincil[h.birincil] || 0) + 1;
        var bu = {};
        h.nedenler.forEach(function (n) {
          var v;
          if (n.kod === 'ogretmenYok') v = varlik('yok:' + n.ogretmenIdx, 'yokIsareti', n.ogretmen, '"Yok" işaretli saatleri');
          else if (n.kod === 'ogretmenDolu') v = varlik('od:' + n.ogretmenIdx, 'ogretmenDersi', n.ogretmen, 'başka sınıflardaki dersleri');
          else if (n.kod === 'sinifDolu') v = varlik('sd:' + n.ders.ad, 'sinifDersi', n.ders.ad, ogretmenMetni(n.ders));
          else if (n.kod === 'ayniGun') v = varlik('ag', 'dagilim', act.label, 'aynı gün kuralı (dağılım ' + act.chunks.join('+') + ')');
          else if (n.kod === 'blokSigmaz') v = varlik('bs', 'dagilim', act.label, k + ' saatlik blok gün sonuna sığmıyor');
          else if (n.kod === 'ogretmenSiniri') v = varlik('lim:' + n.ogretmen, 'sinir', n.ogretmen, 'günlük / art arda ders sınırı');
          else if (n.kod === 'derslik') v = varlik('dr:' + n.derslik, 'derslik', n.derslik, 'derslik kapasitesi');
          if (v && !bu[v.anahtar]) { bu[v.anahtar] = v; v.kapattigi++; v.saatler.push(h.ad); }
        });
        var anahtarlar = Object.keys(bu);
        if (anahtarlar.length === 1) bu[anahtarlar[0]].tekBasina++;
      }
      var sorumlular = Object.keys(varliklar).map(function (x) { return varliklar[x]; });
      sorumlular.sort(function (x, y) { return y.kapattigi - x.kapattigi || y.tekBasina - x.tekBasina; });

      /* öğretmen boşluğu ve gün bazında yük */
      var ogretmenler = eng.uTeachers[u].map(function (t) {
        var te = m.teachers[t], gunler = [], bosMusait = [], yerlesmis = 0;
        for (var dd = 0; dd < D; dd++) {
          var mus = 0, ders = 0, bos = 0, yok = 0;
          for (var pp = 0; pp < m.periodsByDay[dd]; pp++) {
            var av = te.avail[dd * P + pp], v = eng.tg[(t * D + dd) * P + pp];
            if (av === 2) yok++; else mus++;
            if (v >= 0) ders++;
            if (av !== 2 && v < 0) { bos++; bosMusait.push(saatAdi(m, dd, pp)); }
          }
          yerlesmis += ders;

    /* 5e) EN AZ ZARARLA YERLEŞTİR — veri değiştirmeden yerleşmeyen ders kalırsa:

    /* 5c+) Veri değiştirmeden TÜM yerleşmeyenleri sırayla kaydırarak yerleştir */

function saveFile(filename, data) {
  if (cloud.downloads) {
    return cloud.downloads.save({ filename: filename, data: data }).then(function () { toast('Dosya kaydedildi: ' + filename); })
      .catch(function (e) { if (e && e.code === 'declined') return; if (e && (e.code === 'unavailable' || e.code === 'not_granted')) return fallbackDownload(filename, data); toast('İndirme yapılamadı: ' + (e && e.message ? e.message : 'bilinmeyen hata')); });
  }
  return fallbackDownload(filename, data);
}
function fallbackDownload(filename, data) {
  try {
    var blob = data instanceof Blob ? data : new Blob([data], { type: 'application/octet-stream' });
    var url = URL.createObjectURL(blob); var a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
    toast('İndirme başlatıldı: ' + filename);
  } catch (e) { toast('Bu görünümde dosya indirilemiyor.'); }
}

/* ---------- türetilmiş bilgiler ---------- */
function enabledDays() { var out = []; for (var i = 0; i < 7; i++) if (state.settings.days[i]) out.push(i); return out; }
function periodsOf(od) { var v = +state.settings.periodsPerDay[od]; return v > 0 ? v : (+state.settings.periods || 7); }
function maxPeriods() { var m = 0; enabledDays().forEach(function (d) { m = Math.max(m, periodsOf(d)); }); return m; }
function teacherHours(tid) {
  var h = 0;
  state.classes.forEach(function (c) { c.lessons.forEach(function (l) { if (l.teacherId === tid) h += +l.hours || 0; }); });
  state.groups.forEach(function (g) { if (g.members.some(function (m) { return m.teacherId === tid; })) h += +g.hours || 0; });
  return h;
}
function teacherFreeSlots(t) {
  var n = 0; enabledDays().forEach(function (od) { var P = periodsOf(od); for (var p = 0; p < P; p++) if (+t.availability[od + '-' + p] !== 2) n++; });
  return n;
}
function classHours(c) { var h = sum(c.lessons, function (l) { return +l.hours || 0; }); state.groups.forEach(function (g) { if (g.members.some(function (m) { return m.classId === c.id; })) h += +g.hours || 0; }); return h; }
function classSlots(c) { var s = 0; enabledDays().forEach(function (od) { var P = periodsOf(od); s += (+c.periods > 0) ? Math.min(P, +c.periods) : P; }); return s; }
function distLabel(distStr, hours, days) {
  var parsed = S.parseDist(distStr);
  if (parsed) { var sm = parsed.reduce(function (a, b) { return a + b; }, 0); if (sm === hours) return { ok: true, text: parsed.slice().sort(function (a, b) { return b - a; }).join('+') }; return { ok: false, text: 'toplam ' + sm + ' ≠ ' + hours }; }
  var auto = S.autoDist(hours, days); return { ok: !!auto, text: auto ? 'otomatik: ' + auto.join('+') : '-' };
}

      if (p >= periodsOf(od)) return '<td class="na"></td>';
      var v = +t.availability[od + '-' + p] || 0;
      return '<td class="av' + v + '" data-av="' + od + '-' + p + '" role="button" tabindex="0">' + (v === 2 ? 'Yok' : (v === 1 ? 'İst.' : '')) + '</td>';
    }).join('') + '</tr>';
  }

    '<div class="legend" style="margin-top:6px"><span><i></i>Müsait</span><span><i class="av1"></i>İstemiyor (tercih)</span><span><i class="av2"></i>Yok (kesin)</span><span class="hint">Hücreye dokundukça durum değişir; gün veya saat başlığına dokununca sütun/satır toplu değişir.</span></div>';

    datalist() + '<div class="list">' + (items || '<div class="card flat"><p class="lead">Henüz sınıf eklenmedi.</p></div>') + '</div>';
}

/* ---------- 5. Oluştur ---------- */
function renderGenerate() {
  var model = S.compile(plainState());
  var issues = '';
  if (model.errors.length) issues += '<div class="notice n-danger">' + ICON.warn + '<div><strong>Program oluşturulamaz, önce şunları düzeltin:</strong><ul style="margin:6px 0 0 18px;padding:0">' + model.errors.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div></div>';
  if (model.warnings.length) issues += '<div class="notice n-warn">' + ICON.info + '<div><strong>Uyarılar</strong><ul style="margin:6px 0 0 18px;padding:0">' + model.warnings.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div></div>';
  var totalHours = sum(model.activities, function (a) { return a.hours; });
  var stats = '<div class="stats"><div class="stat"><div class="v">' + model.classes.length + '</div><div class="k">sınıf</div></div><div class="stat"><div class="v">' + model.teachers.length + '</div><div class="k">öğretmen</div></div><div class="stat"><div class="v">' + totalHours + '</div><div class="k">haftalık ders saati</div></div><div class="stat"><div class="v">' + model.units.length + '</div><div class="k">yerleştirilecek parça</div></div></div>';
  var lockCount = Object.keys(state.locks).length;
  var gen = ui.gen, body = '';
  if (gen && gen.running) {
    var pct = Math.min(100, Math.round(100 * (gen.elapsed || 0) / (gen.budget || 1)));
    var phaseTxt = gen.phase === 'feasible' ? '1. aşama: önce bütün dersler çakışmasız yerleştiriliyor (yerleşmeyen saat sıfırlanana kadar).' : (gen.phase === 'anneal' ? '2. aşama: bütün dersler korunarak boş saatler ve öğretmen tercihleri iyileştiriliyor.' : 'Başlangıç programı kuruluyor…');
    body = '<div class="stack"><div class="progress"><i style="width:' + pct + '%"></i></div><p class="hint" style="margin:0">' + phaseTxt + '</p><div class="row"><div class="stat"><div class="v">' + (gen.unplaced == null ? '–' : gen.unplaced) + '</div><div class="k">yerleşmemiş saat</div></div><div class="stat"><div class="v">' + (gen.bestCost == null || gen.bestCost === Infinity ? '–' : Math.round(gen.bestCost)) + '</div><div class="k">en iyi puan (düşük iyi)</div></div><div class="stat"><div class="v">' + Math.round((gen.iter || 0) / 1000) + 'k</div><div class="k">deneme</div></div></div><div class="actions"><button class="btn" data-action="stopGen">Durdur ve en iyisini al</button></div></div>';
  } else {
    body = '<div class="actions"><button class="btn btn-primary" data-action="generate" ' + (model.ok && model.units.length ? '' : 'disabled') + '>' + ICON.play + 'Sıfırdan oluştur (' + (state.settings.seconds || 10) + ' sn)</button>' + (state.timetable ? '<button class="btn" data-action="improveAll" ' + (model.ok ? '' : 'disabled') + '>Mevcut programı iyileştir</button><button class="btn" data-action="goProgram">Programı gör</button>' : '') + (state.timetable && ui.undo.length ? '<button class="btn btn-ghost" data-action="undo">Geri al</button>' : '') + '</div>' +
      (state.timetable ? '<div class="actions"><span class="badge b-accent">' + lockCount + ' kilitli ders</span><button class="btn btn-sm" data-action="lockAll">Tüm programı kilitle</button><button class="btn btn-sm" data-action="unlockAll" ' + (lockCount ? '' : 'disabled') + '>Tüm kilitleri kaldır</button><span class="hint">Kilitli dersler hem "iyileştir" hem "sıfırdan oluştur" sırasında yerinde kalır. "İyileştir" mevcut programı olabildiğince koruyup boş saatleri ve tercih ihlallerini azaltır.</span></div>' : '');
  }
  var result = '';
  var tt = state.timetable;
  if (tt && !(gen && gen.running)) {
    var stale = false; try { var gv = getView(); stale = gv.chk.problems.length > 0; } catch (e) { }
    result = '<div class="card"><div class="card-head"><h2>Son sonuç</h2><span class="hint">' + new Date(tt.generatedAt).toLocaleString('tr-TR') + '</span></div>' +
      (stale ? '<div class="notice n-warn" style="margin-bottom:10px">' + ICON.warn + '<div>Veriler değişti; bazı dersler mevcut kurallara uymuyor. Programı iyileştirin ya da yeniden oluşturun.</div></div>' : '') +
      (tt.unplacedHours ? '<div class="notice n-danger" style="margin-bottom:10px">' + ICON.warn + '<div><strong>' + tt.unplacedHours + ' ders saati yerleştirilemedi.</strong> Yukarıdaki "Yerleşmeyen dersler" bölümü her dersin neden yerleşmediğini, kimden kaynaklandığını ve ne yapılırsa yerleşeceğini gösterir.</div></div>' :'<div class="notice n-ok" style="margin-bottom:10px">' + ICON.ok + '<div><strong>Tüm dersler çakışmasız yerleştirildi.</strong> Aşağıdaki liste karşılanamayan tercihleri gösterir.</div></div>') +
      (tt.lockProblems && tt.lockProblems.length ? '<div class="notice n-warn" style="margin-bottom:10px">' + ICON.warn + '<div>' + tt.lockProblems.length + ' kilitli ders kilitlendiği saate konamadı; serbest bırakılarak yerleştirildi.</div></div>' : '') +
      renderReport(tt.report || []) + '</div>';
  }
  var taniHtml = '';
  if (tt && !(gen && gen.running)) {
    taniHtml = renderTani();
    if (taniGerekli() && !(ui.tani && ui.tani.key === taniKey())) setTimeout(function () { startTani(false); }, 0);
  }
  return '<div class="card"><div class="card-head"><h2>Program oluştur</h2>' + sayacRozet() + '</div>' + stats + '<div style="margin-top:12px" class="stack">' + issues + body + '</div></div>' + taniHtml + (model.ok && !(gen && gen.running) ? renderOnKontrol(model) : '') + result;
}

/* ---------- ön kontrol: programı en çok zorlayan öğretmenler ---------- */
function onKontrol(m) {
  var D = m.D, P = m.P, blok = m.teachers.map(function () { return 0; }), rows = [];
  m.units.forEach(function (u) { if (u.size >= 2) m.activities[u.act].teacherIdxs.forEach(function (t) { blok[t]++; }); });
  m.teachers.forEach(function (t, ti) {
    if (!t.hours) return;
    var yer = 0, gun = [];
    for (var d = 0; d < D; d++) {
      var run = 0, mus = 0;
      for (var p = 0; p <= m.periodsByDay[d]; p++) {
        if (p < m.periodsByDay[d] && t.avail[d * P + p] !== 2) { run++; mus++; }
        else { yer += Math.floor(run / 2); run = 0; }
      }
      gun.push(mus);
    }
    var bos = t.freeSlots - t.hours;
    var sev = (blok[ti] > yer || bos < 0) ? 3 : ((bos <= 2 || (blok[ti] && blok[ti] >= yer)) ? 2 : (bos <= 4 ? 1 : 0));
    if (sev) rows.push({ t: t, bos: bos, blok: blok[ti], yer: yer, gun: gun, sev: sev });
  });
  rows.sort(function (a, b) { return b.sev - a.sev || a.bos - b.bos || (a.yer - a.blok) - (b.yer - b.blok); });
  var dolu = m.classes.filter(function (c) { return c.hours > 0 && c.hours >= c.slots; }).length;
  return { rows: rows, doluSinif: dolu, sinif: m.classes.length };
}
function renderOnKontrol(model) {
  if (!model.teachers.length || !model.units.length) return '';
  var ok = onKontrol(model);
  if (!ok.rows.length && !ok.doluSinif) return '';
  var sevAd = { 3: ['b-danger', 'yerleşemez'], 2: ['b-warn', 'çok sıkı'], 1: ['b-muted', 'sıkı'] };
  var rows = ok.rows.slice(0, 15).map(function (r) {
    var notlar = [];
    if (r.bos < 0) notlar.push('müsait saati ders saatinden az');
    if (r.blok > r.yer) notlar.push(r.blok + ' blok dersi var ama art arda müsait saatlere en çok ' + r.yer + ' blok sığıyor');
    else if (r.blok && r.blok >= r.yer) notlar.push('blokların yeri tamamen zorunlu (' + r.yer + ' yer, ' + r.blok + ' blok)');
    if (r.bos >= 0 && r.bos <= 2) notlar.push('haftada yalnız ' + r.bos + ' saat boşu kalıyor');
    return '<tr><td><strong>' + esc(r.t.name) + '</strong></td><td>' + r.t.hours + '</td><td>' + r.t.freeSlots + '</td><td><strong>' + r.bos + '</strong></td><td>' + r.blok + ' / ' + r.yer + '</td><td>' + esc(model.dayShort.map(function (g, i) { return g + ' ' + r.gun[i]; }).join(' · ')) + '</td><td><span class="badge ' + sevAd[r.sev][0] + '">' + sevAd[r.sev][1] + '</span>' + (notlar.length ? '<div class="hint">' + esc(notlar.join('; ')) + '</div>' : '') + '</td></tr>';
  }).join('');
  var acik = ok.rows.some(function (r) { return r.sev >= 2; });
  return '<details class="card tn-onk"' + (acik ? ' open' : '') + '><summary><h2 style="display:inline">Ön kontrol: programı en çok zorlayan öğretmenler</h2> <span class="badge b-muted">' + ok.rows.length + '</span></summary>' +
    '<p class="lead" style="margin:8px 0">Boşluk = müsait saat − ders saati. Boşluğu 0–2 olan öğretmenlerin dersleri programın en zor parçasıdır; ders yerleşmezse önce bu öğretmenlerin "Yok" saatlerini gözden geçirin ("Yok" yerine "İstemiyor" seçilirse program o saati yalnız gerekirse kullanır). Blok / yer: 2 saatlik blok dersi sayısı ile "Yok" olmayan art arda saatlere sığabilecek en çok blok sayısı.</p>' +
    (ok.doluSinif ? '<p class="hint" style="margin:0 0 8px">' + ok.sinif + ' sınıfın ' + ok.doluSinif + ' tanesinde haftalık ders saati programdaki saat sayısına eşit (hiç boş saat yok); bu yüzden bir dersi kaydırmak hep başka bir dersi de kaydırmayı gerektirir.</p>' : '') +
    (rows ? '<div class="tn-scroll"><table class="tn-ozet"><thead><tr><th>Öğretmen</th><th>Ders</th><th>Müsait</th><th>Boşluk</th><th>Blok / yer</th><th>Gün başı müsait saat</th><th>Durum</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '') + '</details>';
}

/* ---------- yerleşmeyen dersler: neden, kimden kaynaklandı, ne yapılırsa yerleşir ---------- */
var taniWorker = null;
function taniKey() { return hashStr(dataHash() + '|' + JSON.stringify(state.timetable ? state.timetable.assignment : null) + '|' + JSON.stringify(state.locks || {})); }
function taniGerekli() {
  var tt = state.timetable; if (!tt) return false;
  try { return getView().eng.unplacedHours > 0; } catch (e) { return tt.unplacedHours > 0; }
}
function stopTani() { if (taniWorker) { taniWorker.terminate(); taniWorker = null; } ui.tani = null; }
function startTani(force) {
  if (!taniGerekli() || (ui.gen && ui.gen.running)) return;
  var key = taniKey();
  if (!force && ui.tani && ui.tani.key === key) return;
  stopTani();
  var data = plainState(), asg = data.timetable.assignment, sn = Math.max(3, Math.min(8, +state.settings.seconds || 5));
  var tn = ui.tani = { key: key, running: true, started: Date.now(), seconds: sn, result: null, iyi: null };
  var fin = function (msg) {
    if (ui.tani !== tn) return;
    if (msg.iyi) tn.iyi = msg.iyi;
    if (msg.esnek) tn.esnek = msg.esnek;
    if (msg.result) tn.result = msg.result;
    if (msg.error) tn.error = msg.error;
    if (msg.type === 'tani') tn.running = false;
    if (ui.tab === 'olustur') render();
  };
  var inline = function () {
    setTimeout(function () {
      try {
        var iyi = S.tani.iyilestirmeyiDene(data, asg, Math.min(sn, 3), 7); fin({ type: 'taniIyi', iyi: iyi });
        if (iyi.ok && iyi.yerlesmeyenSaat > 0) fin({ type: 'taniEsnek', esnek: [S.tani.esnekCoz(data, asg, { saniye: 4 })] });
        fin({ type: 'tani', result: S.tani.tumunuTanila(data, asg, { agir: true, enFazlaAgir: 12 }) });
      } catch (e) { fin({ type: 'tani', error: String(e && e.message || e) }); }
    }, 30);
  };
  try {
    var blob = new Blob([workerSource()], { type: 'text/javascript;charset=utf-8' });
    var w = taniWorker = new Worker(URL.createObjectURL(blob));
    w.onmessage = function (e) { var msg = e.data; if (msg.type === 'taniIyi' || msg.type === 'taniEsnek' || msg.type === 'tani') { if (msg.type === 'tani') { w.terminate(); if (taniWorker === w) taniWorker = null; } fin(msg); } };
    w.onerror = function () { if (taniWorker === w) taniWorker = null; inline(); };
    w.postMessage({ type: 'tani', data: data, asg: asg, seconds: sn });
  } catch (e) { inline(); }
  if (ui.tab === 'olustur') render();
}
function taniGuncelMi() { return ui.tani && ui.tani.key === taniKey(); }
function taniOgretmenOzeti(d) {
  return d.ozet.ogretmenler.map(function (o) { return o.ad + ' (' + o.dersSaati + ' saat ders / ' + o.musaitSaat + ' müsait; boşluk ' + o.bosluk + ')'; }).join(', ') || 'öğretmen atanmamış';
}
function taniKart(d, i) {
  var o = d.ozet, b = d.birim;

  var sade = function (x) { return String(x).replace(/İ/g, 'i').replace(/I/g, 'ı').toLowerCase().replace(/[^0-9a-zçğıöşüâîû]+/g, ''); };
  if (sade(okul) === sade(ORNEK_OKUL)) return;
  if (state.teachers.length < 2 || !state.classes.length) return;
  var anahtar = 'dersProgrami.sayac.' + hashStr(okul.toLocaleLowerCase('tr') + '|' + ilce.toLocaleLowerCase('tr'));
  try { if (localStorage.getItem(anahtar)) return; } catch (e) { }
  var tamam = function () { try { localStorage.setItem(anahtar, String(Date.now())); } catch (e) { } };
  if (/^https?:\/\//.test(SAYAC_GONDER)) {
    if (!window.fetch) return;
    fetch(SAYAC_GONDER, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=utf-8' },

  var alan = function (x, n) { return String(x).replace(/[|\u0000-\u001f]/g, ' ').slice(0, n); };
  var metin = ['1', alan(okul, 80), alan(ilce, 40), state.teachers.length, state.classes.length].join('|');
  var bayt = unescape(encodeURIComponent(metin)), kod = '';

  var f = document.createElement('iframe');

name: Akışları güncelle ve yayımla

on:
  schedule:
    - cron: '17 * * * *'   # her saat (xx.17); 21.10.2026: ziyaret sayacı saatte bir yenilensin diye (önce günde bir, 07.17)
  workflow_dispatch:        # Actions sekmesinden elle çalıştırma
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # 11.10.2026: eski 'yayin' grubunda 38093505359 çalıştırması github-pages onayında takılı kaldı
  # (gözden geçiren yok, yönetici olmadan iptal edilemiyor); yeni grup kuyruğu açar.
  group: yayin-2
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: YouTube ve Instagram akışlarını al
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python araclar/akis_guncelle.py

      - name: Yenilenen Instagram anahtarını sakla
        if: ${{ hashFiles('.yeni_ig_token') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then gh secret set IG_TOKEN < .yeni_ig_token; fi
          rm -f .yeni_ig_token

      - name: Toplam ziyaret sayısını al
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: 6aa67a3c005bba9f3597a16e0140dfde   # hesap kimliği (gizli değil)
        run: python araclar/ziyaret_guncelle.py

      - name: Özetleri derle ve hata denetimini çalıştır
        run: |
          python araclar/yayin_denetle.py --onar
          python araclar/kok_yayin_denetle.py

      - name: Değişen veriyi kaydet
        run: |
          git config user.name "akis-botu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/veri public/ozet public/sitemap.xml araclar/ozetler araclar/gorseller
          if ! git diff --cached --quiet; then
            git commit -m "Sosyal medya akışları, ziyaret sayısı ve özet derlemeleri güncellendi"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: yayin
        uses: actions/deploy-pages@v5


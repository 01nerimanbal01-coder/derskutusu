name: Akışları güncelle ve yayımla

on:
  schedule:
    - cron: '17 4 * * *'   # her gün 07.17 (Türkiye saati)
  workflow_dispatch:        # Actions sekmesinden elle çalıştırma
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: yayin
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: YouTube ve Instagram akışlarını al
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python araclar/akis_guncelle.py

      - name: Yenilenen Instagram anahtarını sakla
        if: ${{ hashFiles('.yeni_ig_token') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then gh secret set IG_TOKEN < .yeni_ig_token; fi
          rm -f .yeni_ig_token

      - name: Toplam ziyaret sayısını al
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: 6aa67a3c005bba9f3597a16e0140dfde   # hesap kimliği (gizli değil)
        run: python araclar/ziyaret_guncelle.py

      - name: Değişen veriyi kaydet
        run: |
          git config user.name "akis-botu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/veri
          if ! git diff --cached --quiet; then
            git commit -m "Sosyal medya akışları ve ziyaret sayısı güncellendi"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: yayin
        uses: actions/deploy-pages@v4

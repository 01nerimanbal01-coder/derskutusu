name: Akışları güncelle ve yayımla

on:
  schedule:
    - cron: '17 * * * *'   # her saat (xx.17); 21.10.2026: ziyaret sayacı saatte bir yenilensin diye (önce günde bir, 07.17)
  workflow_dispatch:        # Actions sekmesinden elle çalıştırma
  push:
    branches: [main]

permissions:
  contents: write
  issues: write      # 23.10.2026: ders dağıtım programını kullanan her yeni okul için bildirim issue'su
  pages: write
  id-token: write

concurrency:
  # 11.10.2026: eski 'yayin' grubunda 38093505359 çalıştırması github-pages onayında takılı kaldı
  # (gözden geçiren yok, yönetici olmadan iptal edilemiyor); yeni grup kuyruğu açar.
  group: yayin-2
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      # 11.11.2026: çalışma hangi commit için açılmış olursa olsun main'in GÜNCEL ucu yayımlanır.
      # 09.11'de, 10.10 tarihli commit için ortam onayında bekleyen eski bir çalışma sonradan yürüyüp
      # o bayat kopyayı yayımlamış, sitenin büyük bölümü 404 vermişti; ref verilince bu olamaz.
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: YouTube ve Instagram akışlarını al
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python araclar/akis_guncelle.py

      - name: Yenilenen Instagram anahtarını sakla
        if: ${{ hashFiles('.yeni_ig_token') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then gh secret set IG_TOKEN < .yeni_ig_token; fi
          rm -f .yeni_ig_token

      - name: Toplam ziyaret sayısını al
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: 6aa67a3c005bba9f3597a16e0140dfde   # hesap kimliği (gizli değil)
        run: python araclar/ziyaret_guncelle.py

      - name: Ders dağıtım programını kullanan okulları al
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: 6aa67a3c005bba9f3597a16e0140dfde   # hesap kimliği (gizli değil)
          GH_TOKEN: ${{ github.token }}
        run: python araclar/ders_dagitim_okullar.py

      - name: Özetleri derle ve hata denetimini çalıştır
        run: |
          python araclar/yayin_denetle.py --onar
          python araclar/kok_yayin_denetle.py

      # 07.11.2026: onarım adımı sınıf dizin sayfalarını (public/sinif-*.html) da yeniden üretiyor. Bu dosyalar
      # eski listede olmadığı için "git pull --rebase" kaydedilmemiş değişiklik yüzünden duruyor, yayın adımları
      # hiç çalışmıyordu (16. hafta özetleri bu yüzden canlıya çıkmadı). Artık yayımlanan public/ klasörünün
      # tamamı kaydedilir; kayıt yine de başarısız olursa site gene yayımlanır, sorun uyarı olarak görünür.
      - name: Değişen veriyi kaydet
        continue-on-error: true
        run: |
          git config user.name "akis-botu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public araclar/ozetler araclar/gorseller araclar/veri
          if ! git diff --cached --quiet; then
            git commit -m "Sosyal medya akışları, ziyaret sayısı ve özet derlemeleri güncellendi"
            if ! git pull --rebase --autostash origin main; then
              # çakışma: yarım kalan birleştirme geri alınır ki yayımlanan dosyalarda çakışma izi kalmasın
              git rebase --abort || true
              echo "::warning::Değişiklikler depoya kaydedilemedi (çakışma); site yine de yayımlanıyor."
              exit 1
            fi
            git push || { echo "::warning::Değişiklikler depoya gönderilemedi; site yine de yayımlanıyor."; exit 1; }
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: yayin
        uses: actions/deploy-pages@v5


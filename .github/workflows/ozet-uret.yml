name: Haftalık özetleri Claude API ile üret

# Elle çalıştırılır: Actions → "Haftalık özetleri Claude API ile üret" → Run workflow.
# Max planının aylık API kredisini kullanır (KURULUM.md → "Claude API kredisiyle özet üretme").
# Var olan özetler atlanır; bütçe ya da süre dolarsa aynı hafta yeniden çalıştırılınca kaldığı yerden sürer.
on:
  workflow_dispatch:
    inputs:
      hafta:
        description: 'Hafta numarası (ör. 15)'
        required: true
      dersler:
        description: 'Yalnız bu dersler, virgülle (ör. 7-matematik,10-tarih). Boş bırakılırsa 103 dersin hepsi'
        required: false
        default: ''
      yontem:
        description: 'toplu = yarı fiyat, sonuç genelde 1 saat içinde; anlik = hemen, iki kat fiyat'
        type: choice
        options:
          - toplu
          - anlik
        default: toplu
      model:
        description: 'Model (Sonnet yaklaşık yarı fiyatına)'
        type: choice
        options:
          - claude-opus-5-5
          - claude-sonnet-5-5
        default: claude-opus-5-5
      caba:
        description: 'Düşünme derinliği (medium daha ucuz)'
        type: choice
        options:
          - medium
          - high
        default: medium
      butce:
        description: 'Bu çalıştırmada en çok harcanacak tutar (USD)'
        required: true
        default: '50'
      kurtarma:
        description: 'Önceki toplu isteklerin ödenmiş sonuçlarını kullan (hayır: bilerek silinen özeti yeniden üretmek için)'
        type: choice
        options:
          - evet
          - hayir
        default: evet

permissions:
  contents: write
  actions: write      # üretimden sonra yayın iş akışını başlatmak için

concurrency:
  group: ozet-uret
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      # Olay anındaki eski commit değil, dalın en güncel hali: yeniden çalıştırmada (Re-run) önceki
      # çalıştırmanın gönderdiği özetler görülür ve onlara ikinci kez para ödenmez.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Gerekli paketler
        run: pip install --quiet 'anthropic>=2.3' pillow

      - name: Özetleri üret
        id: uret
        timeout-minutes: 300
        continue-on-error: true     # süre dolsa da sonraki adımlar ödenmiş çıktıyı yedekler ve yayımlar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HAFTA: ${{ inputs.hafta }}
          DERSLER: ${{ inputs.dersler }}
          YONTEM: ${{ inputs.yontem }}
          MODEL: ${{ inputs.model }}
          CABA: ${{ inputs.caba }}
          BUTCE: ${{ inputs.butce }}
          KURTARMA: ${{ inputs.kurtarma }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY gizli anahtarı yok (KURULUM.md → Claude API kredisiyle özet üretme)"; exit 1
          fi
          set +e
          # adım 300 dakikada kesilir: toplu kipte bekleme kısa, anlık kipte açık istekler ve düzeltmeler için pay
          if [ "$YONTEM" = "toplu" ]; then ARG=(--toplu --sure-dk 280); else ARG=(--sure-dk 250); fi
          ARG+=(--hafta "$HAFTA" --model "$MODEL" --caba "$CABA" --butce "$BUTCE" --paralel 4)
          if [ "$KURTARMA" = "hayir" ]; then ARG+=(--kurtarma-yok); fi
          if [ -n "$DERSLER" ]; then ARG+=(--dersler "$DERSLER"); fi
          python araclar/ozet_api_uret.py "${ARG[@]}" 2>&1 | tee "$RUNNER_TEMP/uretim.log"
          echo "kod=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # Üretilen kaynak dosyalar (özet JSON, görsel modülü, sosyal kart metni) parası ödenmiş çıktıdır:
      # derleme ya da gönderim başarısız olsa, çalıştırma iptal edilse bile kaybolmasın diye yedeklenir.
      - name: Üretilen dosyaları yedekle
        id: yedek
        if: always()
        run: |
          {
            echo "### ${{ inputs.hafta }}. hafta özet üretimi"
            echo '```'
            tail -n 60 "$RUNNER_TEMP/uretim.log" 2>/dev/null || echo "üretim günlüğü yok"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git add -A araclar/ozetler araclar/gorseller araclar/sosyal
          git diff --cached --name-only --diff-filter=A > "$RUNNER_TEMP/yeni.txt"
          git reset -q
          echo "adet=$(grep -c 'araclar/ozetler/' "$RUNNER_TEMP/yeni.txt" || true)" >> "$GITHUB_OUTPUT"
          if [ -s "$RUNNER_TEMP/yeni.txt" ]; then
            mkdir -p "$RUNNER_TEMP/uretim"
            tar czf "$RUNNER_TEMP/uretim/kaynak.tgz" -T "$RUNNER_TEMP/yeni.txt"
          fi

      - uses: actions/upload-artifact@v6
        if: always() && steps.yedek.outputs.adet != '' && steps.yedek.outputs.adet != '0'
        with:
          name: hafta-${{ inputs.hafta }}-uretilen-ozetler
          path: ${{ runner.temp }}/uretim/kaynak.tgz
          retention-days: 30

      # Üretim saatler sürebilir; bu sırada saatlik yayın botu ana dala yazmış olabilir. Bu yüzden her
      # denemede en güncel dal alınır, yeni dosyalar üstüne konur, türetilen sayfalar ve paylaşım kuyruğu
      # yeniden üretilir. Yayın denetimine takılan yeni özet ayıklanır, kalanlar yine yayımlanır.
      - name: Derle, denetle, kaydet ve yayına gönder
        if: ${{ !cancelled() && steps.yedek.outputs.adet != '' && steps.yedek.outputs.adet != '0' }}
        env:
          HAFTA: ${{ inputs.hafta }}
          GH_TOKEN: ${{ github.token }}
          ANA_DAL: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "ozet-botu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for deneme in 1 2 3 4; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            # bu sırada dala başka yoldan gelmiş dosyaların üzerine yazılmaz
            tar xzf "$RUNNER_TEMP/uretim/kaynak.tgz" --skip-old-files
            if ! python araclar/ozet_api_uret.py --yayin-hazirla "$RUNNER_TEMP/yeni.txt"; then
              # ilgisiz bir denetim hatası: sayfalar derlenmez ama parası ödenmiş kaynak dosyalar kaybolmasın
              git reset -q --hard "origin/$GITHUB_REF_NAME"
              tar xzf "$RUNNER_TEMP/uretim/kaynak.tgz" --skip-old-files
              git add araclar/ozetler araclar/gorseller araclar/sosyal
              git commit -q -m "$HAFTA. hafta: üretilen özet kaynakları (sayfalar yayın denetimi düzelince derlenir)" || true
              git push -q origin "HEAD:$GITHUB_REF_NAME" || true
              echo "::error::Yayın denetimi bu çalıştırmanın özetleriyle ilgisiz bir nedenle başarısız; kaynak dosyalar kaydedildi, sayfalar derlenmedi."
              exit 1
            fi
            python araclar/sosyal_gorsel.py --kuyruk "$(python araclar/ozet_api_uret.py --kuyruk-baslangici)" \
              || echo "::warning::Sosyal medya kartları çizilemedi ya da kuyruğa eklenemedi; özetler yine yayımlanıyor."
            ADET=$(git status --porcelain --untracked-files=all -- araclar/ozetler | grep -c '^??' || true)
            if [ "$ADET" = "0" ]; then echo "::error::Yayımlanacak özet kalmadı (hepsi denetime takıldı)."; exit 1; fi
            git add araclar/ozetler araclar/gorseller araclar/sosyal araclar/veri public sosyal
            git commit -q -m "$HAFTA. hafta: $ADET konu özeti Claude API ile üretildi"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              if [ "$GITHUB_REF_NAME" = "$ANA_DAL" ]; then
                echo "$ADET özet kaydedildi ve yayına gönderildi." | tee -a "$GITHUB_STEP_SUMMARY"
                # GITHUB_TOKEN ile yapılan push başka iş akışını tetiklemez; yayını elle başlat
                gh workflow run guncelle.yml --ref "$GITHUB_REF_NAME"
              else
                # deneme dalı: site yalnız ana daldan yayımlanır, özetler dal birleşince yayına çıkar
                echo "$ADET özet $GITHUB_REF_NAME dalına kaydedildi; dal ana dala birleşince yayımlanır." | tee -a "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
            fi
            echo "Gönderim reddedildi (dal bu arada ilerlemiş); $deneme. deneme, yeniden derleniyor."
            sleep $((deneme * 15))
          done
          echo "::error::Gönderilemedi. Üretilen özetler bu çalıştırmanın Artifacts bölümünde duruyor."
          exit 1

      - name: Hatalı, bekleyen ya da ayıklanan ders varsa bildir
        if: ${{ !cancelled() }}
        env:
          KOD: ${{ steps.uret.outputs.kod }}
        run: |
          if [ -s "$RUNNER_TEMP/ayiklanan.txt" ]; then
            echo "::warning::Yayın denetimine takıldığı için ayıklanan özetler: $(paste -sd, "$RUNNER_TEMP/ayiklanan.txt"). Yeniden üretmek için aynı haftayı 'kurtarma: hayir' ile ve yalnız bu derslerle çalıştırın."
            exit 1
          fi
          if [ "$KOD" != "0" ]; then
            echo "::warning::Bazı dersler üretilemedi ya da bütçe/süre doldu; ayrıntı özet sayfasında. Aynı haftayı yeniden çalıştırın, kalanlar üretilir."
            exit 1
          fi

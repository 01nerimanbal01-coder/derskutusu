name: Depo düzeni (tek seferlik)

# 23.10.2026: kullanıcı onayı — gereksiz kalan PR #8 ve #12 kapatılır, Hakkında'ya site adresi yazılır.
# Yalnız bu dosya gönderildiğinde çalışır; iş bitince dosya silinir.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/depo-duzen.yml']

permissions:
  contents: read
  pull-requests: write

jobs:
  duzen:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Gereksiz kalan PR'ları kapat (#8, #12)
        run: |
          for n in 8 12; do
            if [ "$(gh pr view $n --json state -q .state)" = "OPEN" ]; then
              gh pr close $n --comment "Bu PR'daki konu özetlerinin tamamı ana dalda zaten yayında; artık gerekmediği için kapatıldı (23.10.2026)."
            fi
            gh pr view $n --json number,state -q '"#\(.number) \(.state)"'
          done

      - name: Hakkında bölümüne site adresi
        continue-on-error: true   # iş akışı anahtarı depo ayarını değiştiremeyebilir (yönetici izni gerekir)
        run: gh api -X PATCH "repos/$GH_REPO" -f homepage=https://derskutusu.com -q .homepage

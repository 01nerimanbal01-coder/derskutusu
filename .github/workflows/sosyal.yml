name: Sosyal medya paylaşımı

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # 15 dakikada bir
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sosyal
  cancel-in-progress: false

jobs:
  paylas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zamanı gelen gönderiyi paylaş
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python3 araclar/sosyal_paylas.py
      - name: Kuyruk durumunu kaydet
        run: |
          git config user.name "sosyal-botu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sosyal/kuyruk.json
          if ! git diff --cached --quiet; then git commit -m "Sosyal medya kuyruğu güncellendi" && git pull --rebase && git push; fi

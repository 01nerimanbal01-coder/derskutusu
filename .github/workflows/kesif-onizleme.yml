name: Renkli ana sayfa tarayıcı denetimi

on:
  push:
    branches: ['codex/kategori-onizleme-esite-*']

permissions:
  contents: read

jobs:
  tarayici:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tests/renkli-anasayfa.cjs
            /public/index.html
            /public/*.js
            /public/*.css
            /public/anasayfa-renkli/
            /public/veri/ayarlar.json
            /public/veri/icerikler.json
            /public/veri/dersler.json
            /public/veri/yazili-kagitlari.json
            /public/veri/yazili-cikti.json
            /public/veri/ziyaret.json
            /public/veri/indirmeler.json
            /public/veri/agac/dizin.json
            /public/veri/agac/8-*.json
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Chromium ve WebKit kur
        run: |
          npm install --prefix "$RUNNER_TEMP/esite-qa" --no-save --package-lock=false --ignore-scripts @playwright/test@1.56.1
          "$RUNNER_TEMP/esite-qa/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Mobil gezinme, arama ve koyu tema denetimi
        env:
          NODE_PATH: ${{ runner.temp }}/esite-qa/node_modules
        run: node tests/renkli-anasayfa.cjs
